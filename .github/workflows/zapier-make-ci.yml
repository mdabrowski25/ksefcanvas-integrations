name: Zapier and Make CI

on:
  pull_request:
    paths: ["zapier/**", "make/**", ".github/workflows/zapier-make-ci.yml"]
  push:
    branches: [main]
    paths: ["zapier/**", "make/**", ".github/workflows/zapier-make-ci.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [zapier, make]
    defaults:
      run:
        working-directory: ${{ matrix.module }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.module }}/package-lock.json

      - name: Install dependencies
        run: 'npm ci'

      - name: Run tests
        run: 'npm test'
